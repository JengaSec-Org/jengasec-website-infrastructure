---
# Handlers for the `minio` role.
#
# Handlers run once, at the end of the play, no matter how many tasks notified
# them. Restarting a service is a handler, never a task.

- name: Restart minio
  ansible.builtin.systemd:
    name: "{{ minio_service_name | default('minio') }}"
    state: restarted
    daemon_reload: true
  listen: "restart minio"
  when: minio_enabled | bool
