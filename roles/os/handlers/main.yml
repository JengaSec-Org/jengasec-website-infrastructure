---
# Handlers for the `os` role.

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
  listen: "reload sysctl"

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  listen: "restart journald"

# Not a restart — `systemctl daemon-reexec` re-executes PID 1 in place so it
# picks up the new system.conf limits. Running services are unaffected.
- name: Reexec systemd
  ansible.builtin.systemd:
    daemon_reexec: true
  listen: "reexec systemd"
