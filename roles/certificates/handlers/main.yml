---
# Handlers for the `certificates` role.

# Rebuilds /etc/ssl/certs/ca-certificates.crt from the system trust store.
# Until this runs, the CA certificate is on disk but nothing trusts it — curl
# and psql still reject internally issued certificates.
- name: Update CA trust
  ansible.builtin.command:
    cmd: update-ca-certificates
  changed_when: true
  listen: "update ca trust"
