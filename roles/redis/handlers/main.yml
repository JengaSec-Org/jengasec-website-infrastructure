---
# Handlers for the `redis` role.
#
# Handlers run once, at the end of the play, no matter how many tasks notified
# them. Restarting a service is a handler, never a task.

- name: Restart redis
  ansible.builtin.systemd:
    name: "{{ redis_service_name | default('redis') }}"
    state: restarted
    daemon_reload: true
  listen: "restart redis"
  when: redis_enabled | bool
