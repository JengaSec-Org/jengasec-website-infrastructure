---
# Handlers for the `cloudflare` role.

- name: Reload systemd for cloudflared
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "reload systemd for cloudflared"

# Restart, not reload — cloudflared has no config reload signal.
#
# The gap is brief and mostly invisible: Cloudflare holds requests for a few
# seconds while the tunnel reconnects, and with ha-connections the edge still
# has other connections to this host during a rolling restart. A visitor sees a
# pause, not an error.
- name: Restart cloudflared
  ansible.builtin.systemd:
    name: "{{ cloudflare_service_name }}"
    state: restarted
  listen: "restart cloudflared"
