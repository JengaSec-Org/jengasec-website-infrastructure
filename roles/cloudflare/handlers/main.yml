---
# Handlers for the `cloudflare` role.
#
# Handlers run once, at the end of the play, no matter how many tasks notified
# them. Restarting a service is a handler, never a task.

- name: Restart cloudflare
  ansible.builtin.systemd:
    name: "{{ cloudflare_service_name | default('cloudflare') }}"
    state: restarted
    daemon_reload: true
  listen: "restart cloudflare"
  when: cloudflare_enabled | bool
