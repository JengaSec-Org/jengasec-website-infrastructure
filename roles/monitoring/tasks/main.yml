---
# monitoring — Phase 7
#
# Does two different jobs depending on group membership. The role is included by
# both plays in playbooks/monitoring.yml and decides for itself which parts
# apply, so there is one role rather than three.

- name: Install node_exporter
  ansible.builtin.include_tasks: node_exporter.yml
  when: "'monitored' in group_names"
  tags: [monitoring, node-exporter]

- name: Install Prometheus
  ansible.builtin.include_tasks: prometheus.yml
  when: "'monitoring' in group_names"
  tags: [monitoring, prometheus]

- name: Install Grafana
  ansible.builtin.include_tasks: grafana.yml
  when:
    - "'monitoring' in group_names"
    - grafana_enabled | bool
  tags: [monitoring, grafana]
