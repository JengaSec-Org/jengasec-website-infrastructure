---
# Handlers for the `monitoring` role.

- name: Restart node_exporter
  ansible.builtin.systemd:
    name: "{{ node_exporter_service }}"
    state: restarted
  listen: "restart node_exporter"

# POST /-/reload rather than a service restart. A restart interrupts scraping
# and leaves a gap in every graph; a reload re-reads the config and the rules
# with no gap at all.
#
# Needs --web.enable-lifecycle, which prometheus-defaults sets.
- name: Reload prometheus
  ansible.builtin.uri:
    url: "http://{{ prometheus_bind }}:{{ prometheus_port }}/-/reload"
    method: POST
    status_code: [200]
    timeout: 15
  listen: "reload prometheus"
  failed_when: false      # not yet running on the very first pass

# Only for the daemon flags in /etc/default, which are read at startup — a
# reload cannot change the retention or the listen address.
- name: Restart prometheus
  ansible.builtin.systemd:
    name: "{{ prometheus_service }}"
    state: restarted
  listen: "restart prometheus"

- name: Restart grafana
  ansible.builtin.systemd:
    name: "{{ grafana_service }}"
    state: restarted
  listen: "restart grafana"
