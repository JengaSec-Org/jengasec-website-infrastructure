---
# Handlers for the `gunicorn` role.
#
# Handlers run once, at the end of the play, no matter how many tasks notified
# them. Restarting a service is a handler, never a task.

- name: Restart gunicorn
  ansible.builtin.systemd:
    name: "{{ gunicorn_service_name | default('gunicorn') }}"
    state: restarted
    daemon_reload: true
  listen: "restart gunicorn"
  when: gunicorn_enabled | bool
