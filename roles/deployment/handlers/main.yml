---
# Handlers for the `deployment` role.
#
# Handlers run once, at the end of the play, no matter how many tasks notified
# them. Restarting a service is a handler, never a task.

- name: Restart deployment
  ansible.builtin.systemd:
    name: "{{ deployment_service_name | default('deployment') }}"
    state: restarted
    daemon_reload: true
  listen: "restart deployment"
  when: deployment_enabled | bool
