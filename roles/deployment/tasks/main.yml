---
# deployment — Phase 7
#
# Ships a revision onto a running platform. Record what is live, deploy, verify,
# and preserve failed-release state for a compatible forward correction.

# ── Record what is currently live ───────────────────────────────────────────
# Record the previous revision before changing source so an incident can be
# traced without restoring an earlier release.

- name: Require forward repair after a failed deployment
  ansible.builtin.assert:
    that:
      - not (deployment_rollback_on_failure | bool)
    fail_msg: >-
      Automatic release rollback is no longer supported. Set
      deployment_rollback_on_failure=false and preserve failed-release state
      for a compatible forward correction. Any emergency release rollback
      needs a separate incident decision and schema compatibility review.
  tags: [deployment, always]

- name: Ensure the deployment state directory exists
  ansible.builtin.file:
    path: "{{ deployment_state_dir }}"
    state: directory
    owner: "{{ deployment_user }}"
    group: "{{ app_group | default('jengasec') }}"
    mode: "0750"
  tags: [deployment, state]

- name: Record the currently deployed revision
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ deployment_source_dir }}"
  become: true
  become_user: "{{ deployment_user }}"
  register: deployment_previous
  changed_when: false
  failed_when: false
  tags: [deployment, state]

- name: Check for uncommitted changes
  ansible.builtin.command:
    cmd: git status --porcelain
    chdir: "{{ deployment_source_dir }}"
  become: true
  become_user: "{{ deployment_user }}"
  register: deployment_dirty
  changed_when: false
  failed_when: false
  tags: [deployment, state]

# Someone hot-fixed something on the server. Deploying over it destroys both the
# fix and the evidence of what was wrong — and whoever did it is probably not in
# the room.
- name: Refuse to deploy over uncommitted changes
  ansible.builtin.assert:
    that:
      - deployment_dirty.stdout | default('') | trim | length == 0
    fail_msg: >-
      {{ deployment_source_dir }} has uncommitted changes on
      {{ inventory_hostname }}:
      {{ deployment_dirty.stdout_lines | default([]) | join(', ') }}.
      Someone changed something on the server. Deploying would destroy it and
      the evidence of why. Investigate first, then either commit the change
      upstream or set deployment_refuse_if_dirty: false to discard it
      deliberately.
    success_msg: "Working tree is clean"
  when: deployment_refuse_if_dirty | bool
  tags: [deployment, state]

- name: Announce the deployment in the journal
  ansible.builtin.command:
    cmd: >-
      systemd-cat -t jengasec-deploy -p notice
      echo "deploy starting: {{ deployment_previous.stdout | default('unknown') | truncate(12, true, '') }}
      -> {{ deployment_revision }} by {{ lookup('env', 'USER') | default('ansible') }}"
  changed_when: false
  failed_when: false
  when: deployment_log_to_journal | bool
  tags: [deployment, state]

# ── Maintenance page ────────────────────────────────────────────────────────

- name: Enable the maintenance page
  ansible.builtin.template:
    src: maintenance.html.j2
    dest: "{{ deployment_maintenance_file }}"
    owner: root
    group: www-data
    mode: "0644"
  when: deployment_maintenance_page | bool
  tags: [deployment, maintenance]

# ── Deploy ──────────────────────────────────────────────────────────────────

- name: Deploy and verify the requested revision
  block:
    # Use the same KEY=value file format as the Django role. settings.py
    # otherwise reads only a checkout-local .env and can fall back to SQLite.
    - name: Read the configured application environment
      ansible.builtin.slurp:
        src: "{{ deployment_env_file }}"
      become: true
      become_user: "{{ deployment_user }}"
      register: deployment_env_raw
      no_log: true
      tags: [always]

    - name: Parse the configured application environment
      ansible.builtin.set_fact:
        deployment_runtime_env: >-
          {{ {'JENGASEC_DB_URL': ''} | combine(dict(
             deployment_env_raw.content | b64decode
             | regex_findall('(?m)^([A-Za-z_][A-Za-z0-9_]*)=([^\r\n]*)'))) }}
      no_log: true
      tags: [always]

    - name: Require an explicit database in the application environment
      ansible.builtin.assert:
        that:
          - >-
            (deployment_runtime_env.get('JENGASEC_DB_URL', '') | trim | length > 0) or
            ((deployment_runtime_env.get('JENGASEC_DB_NAME', '') | trim | length > 0) and
             (deployment_runtime_env.get('JENGASEC_DB_HOST', '') | trim | length > 0) and
             (deployment_runtime_env.get('JENGASEC_DB_USER', '') | trim | length > 0))
        fail_msg: >-
          The configured environment must select the application database.
          Empty/default environment and SQLite fallback are not supported.
      no_log: true
      tags: [always]

    - name: Fetch the target revision
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "{{ deployment_source_dir }}"
        version: "{{ deployment_revision }}"
        force: "{{ not (deployment_refuse_if_dirty | bool) }}"
      become: true
      become_user: "{{ deployment_user }}"
      register: deployment_checkout
      tags: [deployment, code]

    - name: Install updated requirements
      ansible.builtin.pip:
        requirements: "{{ deployment_source_dir }}/requirements.txt"
        virtualenv: "{{ deployment_venv_dir }}"
        state: present
      become: true
      become_user: "{{ deployment_user }}"
      when: deployment_install_requirements | bool
      tags: [deployment, code]

    # Migrations run BEFORE the reload, deliberately.
    #
    # The old code must tolerate the new schema for the moment between them, which
    # is why additive migrations (add a column, add a table) are safe to deploy this
    # way and destructive ones (drop or rename a column) are not — those need two
    # releases. Worth knowing before writing the migration, not after.
    - name: Run migrations
      ansible.builtin.command:
        cmd: "{{ deployment_venv_dir }}/bin/python manage.py migrate --noinput"
        chdir: "{{ deployment_source_dir }}"
      become: true
      become_user: "{{ deployment_user }}"
      environment: "{{ deployment_runtime_env }}"
      register: deployment_migrate
      changed_when: "'No migrations to apply' not in (deployment_migrate.stdout | default(''))"
      when: deployment_run_migrations | bool
      no_log: true
      tags: [deployment, migrate]

    - name: Collect static files
      ansible.builtin.command:
        cmd: "{{ deployment_venv_dir }}/bin/python manage.py collectstatic --noinput"
        chdir: "{{ deployment_source_dir }}"
      become: true
      become_user: "{{ deployment_user }}"
      environment: "{{ deployment_runtime_env }}"
      register: deployment_collect
      changed_when: "'0 static files copied' not in (deployment_collect.stdout | default(''))"
      when: deployment_collectstatic | bool
      no_log: true
      tags: [deployment, static]

    # ── Reload ──────────────────────────────────────────────────────────────────

    # Reload, not restart. gunicorn re-execs its workers while holding the socket
    # open, so nothing in flight is dropped and no request is refused.
    - name: Reload the application
      ansible.builtin.systemd:
        name: "{{ gunicorn_service_name | default('gunicorn') }}"
        state: reloaded
      tags: [deployment, reload]

    # ── Verify ──────────────────────────────────────────────────────────────────

    # /healthz/ runs SELECT 1, so a 200 means the application started AND can reach
    # the database. Checking / would return 200 with PostgreSQL completely down.
    - name: Health check the new release
      ansible.builtin.uri:
        url: "{{ deployment_healthcheck_url }}"
        unix_socket: "{{ deployment_healthcheck_unix_socket | default(omit, true) }}"
        headers:
          Host: "{{ deployment_healthcheck_host }}"
        follow_redirects: none
        use_proxy: false
        validate_certs: "{{ deployment_healthcheck_validate_certs | bool }}"
        ca_path: "{{ deployment_healthcheck_ca_path | default(omit, true) }}"
        timeout: "{{ deployment_healthcheck_timeout }}"
        status_code: [200]
      register: deployment_health
      retries: "{{ deployment_healthcheck_retries }}"
      delay: "{{ deployment_healthcheck_delay }}"
      until: >-
        (deployment_health.status | default(0)) == 200 and
        (deployment_health.json | default({})) is mapping and
        (deployment_health.json.status | default('')) == 'ok' and
        (deployment_health.json.database | default('')) == 'ok'
      changed_when: false
      when: deployment_healthcheck_enabled | bool
      tags: [deployment, verify]

    - name: Disable the maintenance page
      ansible.builtin.file:
        path: "{{ deployment_maintenance_file }}"
        state: absent
      when: deployment_maintenance_page | bool
      tags: [deployment, maintenance]

    - name: Report a successful deployment
      ansible.builtin.debug:
        msg: >-
          Deployed {{ deployment_checkout.after | default('?') | truncate(12, true, '') }}
          to {{ inventory_hostname }}. Health check returned
          {{ deployment_health.status | default('not checked') }}.
          {{ 'Migrations applied.' if (deployment_migrate.changed | default(false)) else 'No migrations.' }}
      tags: [deployment, verify]

    # ── Record the release ──────────────────────────────────────────────────────

    # Appended after a successful deployment. During an incident, "what changed and
    # when" is the first question, and this file answers it without needing git.
    - name: Append to the release log
      ansible.builtin.lineinfile:
        path: "{{ deployment_state_dir }}/releases.log"
        line: >-
          {{ ansible_date_time.iso8601 }}
          {{ deployment_checkout.after | default('?') }}
          {{ deployment_revision }}
          {{ 'migrations' if (deployment_migrate.changed | default(false)) else 'no-migrations' }}
        create: true
        owner: "{{ deployment_user }}"
        group: "{{ app_group | default('jengasec') }}"
        mode: "0640"
      tags: [deployment, state]
  rescue:
    - name: Retain the requested maintenance page after a failure
      ansible.builtin.template:
        src: maintenance.html.j2
        dest: "{{ deployment_maintenance_file }}"
        owner: root
        group: www-data
        mode: "0644"
      when: deployment_maintenance_page | bool
      tags: [always]

    - name: Stop for a forward correction without restoring release state
      ansible.builtin.fail:
        msg: >-
          DEPLOYMENT FAILED on {{ inventory_hostname }} during
          {{ ansible_failed_task.name | default('deployment') }}.
          Source, installed dependencies, applied migrations, database contents,
          media, evidence and collected static files remain in their current state.
          No automatic release rollback or database restore was attempted.
          {{ 'The requested maintenance page remains enabled.'
             if deployment_maintenance_page | bool else
             'Contain the affected operation if it is unsafe to keep serving.' }}
          Preserve queued telemetry, pending acknowledgements and score revisions.
          Inspect the failed task and application journal, then deploy and verify
          a compatible versioned correction. A code revision does not restore
          database contents or runtime effects.
      tags: [always]
  tags: [deployment]
