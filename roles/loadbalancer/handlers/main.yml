---
# Handlers for the `loadbalancer` role.
#
# Handlers run once, at the end of the play, no matter how many tasks notified
# them. Restarting a service is a handler, never a task.

- name: Restart loadbalancer
  ansible.builtin.systemd:
    name: "{{ loadbalancer_service_name | default('loadbalancer') }}"
    state: restarted
    daemon_reload: true
  listen: "restart loadbalancer"
  when: loadbalancer_enabled | bool
