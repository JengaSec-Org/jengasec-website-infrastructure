---
# Handlers for the `loadbalancer` role.

# HAProxy's reload starts a new process that takes over the listening sockets
# while the old one finishes its in-flight requests. Nothing is dropped.
#
# The config is validated with `haproxy -c -f` before this can run, so a reload
# cannot be handed anything unparseable.
- name: Reload haproxy
  ansible.builtin.systemd:
    name: "{{ loadbalancer_service_name }}"
    state: reloaded
  listen: "reload haproxy"

# Only for a change to the bind addresses or the global section. Drops every
# connection, so it is not notified by anything in this role today.
- name: Restart haproxy
  ansible.builtin.systemd:
    name: "{{ loadbalancer_service_name }}"
    state: restarted
  listen: "restart haproxy"
