---
# Handlers for the `backup` role.

# systemd does not notice a new unit file on its own — the symptom is
# "Unit not found" for a file you can plainly see on disk.
- name: Reload systemd for backup
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "reload systemd for backup"

- name: Restart backup timer
  ansible.builtin.systemd:
    name: jengasec-backup.timer
    state: restarted
  listen: "restart backup timer"
