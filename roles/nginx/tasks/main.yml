---
# nginx — Phase 4
#
# Reverse proxy, load balancer, and the only thing serving static and media.

# ── Guards ──────────────────────────────────────────────────────────────────

- name: Assert at least one upstream backend is defined
  ansible.builtin.assert:
    that:
      - nginx_upstream_servers | length > 0
    fail_msg: >-
      nginx_upstream_servers is empty. nginx would start with an upstream block
      containing no servers, and nginx -t rejects that — the play fails here
      instead, with a message that says why.
    success_msg: >-
      {{ nginx_upstream_servers | length }} backend(s),
      balanced with {{ nginx_upstream_method | default('round-robin') }}
  tags: [nginx, always]

# gunicorn_timeout is 120 by default and proxy_read_timeout 180. If someone
# raises the former past the latter, nginx returns 504 while the worker is
# still doing useful work — and the request completes into a connection nobody
# is listening to.
- name: Assert the proxy timeout exceeds the gunicorn timeout
  ansible.builtin.assert:
    that:
      - (nginx_proxy_read_timeout | int) > (gunicorn_timeout | default(120) | int)
    fail_msg: >-
      nginx_proxy_read_timeout ({{ nginx_proxy_read_timeout }}s) is not greater
      than gunicorn_timeout ({{ gunicorn_timeout | default(120) }}s). nginx
      would give up first and show a 504 while the worker is still working.
    success_msg: >-
      Timeouts agree — nginx {{ nginx_proxy_read_timeout }}s >
      gunicorn {{ gunicorn_timeout | default(120) }}s
  tags: [nginx, always]

- name: Warn when sticky sessions are pointless
  ansible.builtin.debug:
    msg: >-
      nginx_sticky_sessions is on with only one backend. ip_hash REPLACES
      {{ nginx_upstream_method }}, so this currently costs balancing quality and
      buys nothing. It also puts everyone behind a single NAT address on one
      backend. Turn it off unless you have several backends and a real reason.
  when:
    - nginx_sticky_sessions | bool
    - nginx_upstream_servers | length < 2
  tags: [nginx, always]

# ── Install ─────────────────────────────────────────────────────────────────

- name: Install nginx
  ansible.builtin.apt:
    name: "{{ nginx_packages }}"
    state: present
  tags: [nginx, packages]

# The site template needs it: how HTTP/2 is switched on changed in 1.25.1, and
# the newer `http2 on;` is an unknown directive to Debian 12's nginx 1.22.
# `nginx -v` prints to stderr, as "nginx version: nginx/1.22.1".
- name: Read the installed nginx version
  ansible.builtin.command:
    cmd: nginx -v
  register: nginx_version_out
  changed_when: false
  check_mode: false
  tags: [nginx, always]

# Only digits and dots ever reach the version test: regex_findall with no
# capture group returns exactly "nginx/1.22.1", the prefix is dropped, and
# anything unexpected falls back to 1.22 (Debian 12's). A value with text in
# it makes `version` fail with "'<' not supported between str and int".
- name: Record the nginx version
  ansible.builtin.set_fact:
    nginx_version: >-
      {{ nginx_version_out.stderr
         | regex_findall('nginx/[0-9]+\\.[0-9]+\\.?[0-9]*')
         | map('replace', 'nginx/', '')
         | first | default('1.22.0', true) }}
  tags: [nginx, always]

# Decided once, here, as a plain true/false; the template only reads it.
- name: Decide how HTTP/2 is switched on
  ansible.builtin.set_fact:
    nginx_http2_directive: "{{ nginx_version is version('1.25.1', '>=') }}"
  tags: [nginx, always]

- name: Report the nginx version
  ansible.builtin.debug:
    msg: >-
      nginx {{ nginx_version }} —
      {{ 'http2 on;' if nginx_http2_directive | bool else 'listen ... ssl http2;' }}
  tags: [nginx, always]

- name: Create the snippets directory
  ansible.builtin.file:
    path: "{{ nginx_conf_dir }}/snippets"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [nginx, config]

# nginx.conf sets proxy_temp_path here. Debian's package keeps its own temp
# files under /var/lib/nginx and never creates /var/cache/nginx, and nginx
# refuses the whole config (`nginx -t` fails, so the validate below fails)
# when the parent is missing. Owned by the worker user, which writes to it.
- name: Create the proxy temp directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: root
    mode: "0700"
  loop:
    - /var/cache/nginx
    - /var/cache/nginx/tmp
  tags: [nginx, config]

# ── TLS certificate ─────────────────────────────────────────────────────────

# A purchased certificate (nginx_custom_tls_enabled). Installed from the vault,
# then checked BEFORE nginx is pointed at it: a key that does not match its
# certificate, or one past its date, otherwise shows up as nginx refusing to
# start or every browser refusing the site.
- name: Install the purchased certificate
  when: nginx_custom_tls_enabled | bool
  tags: [nginx, tls]
  block:
    - name: Refuse to enable the purchased certificate without it
      when: nginx_custom_tls_source == 'vault'
      ansible.builtin.assert:
        that:
          - "'BEGIN CERTIFICATE' in nginx_custom_tls_fullchain"
          - "'PRIVATE KEY' in nginx_custom_tls_key"
        fail_msg: >-
          nginx_custom_tls_enabled is true but vault_custom_tls_fullchain or
          vault_custom_tls_key is empty or not PEM. See docs/custom-certificate.md.
        quiet: true

    - name: Refuse a Let's Encrypt source that certbot has not issued yet
      when: nginx_custom_tls_source == 'letsencrypt'
      ansible.builtin.stat:
        path: "{{ nginx_ssl_certificate }}"
      register: nginx_le_cert

    - name: Explain a missing Let's Encrypt certificate
      when:
        - nginx_custom_tls_source == 'letsencrypt'
        - not nginx_le_cert.stat.exists
      ansible.builtin.fail:
        msg: >-
          {{ nginx_ssl_certificate }} does not exist. Issue it first with
          certbot's DNS challenge (docs/custom-certificate.md, "No certificate
          yet"), for exactly {{ nginx_custom_tls_letsencrypt_name }}. nginx has
          NOT been changed.

    - name: Create the purchased-certificate directory
      when: nginx_custom_tls_source == 'vault'
      ansible.builtin.file:
        path: "{{ nginx_custom_tls_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write the certificate chain
      when: nginx_custom_tls_source == 'vault'
      ansible.builtin.copy:
        content: "{{ nginx_custom_tls_fullchain | trim }}\n"
        dest: "{{ nginx_custom_tls_dir }}/fullchain.crt"
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Write the private key
      when: nginx_custom_tls_source == 'vault'
      ansible.builtin.copy:
        content: "{{ nginx_custom_tls_key | trim }}\n"
        dest: "{{ nginx_custom_tls_dir }}/private.key"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Reload nginx

    # The public key inside the certificate must equal the one derived from
    # the private key. Works for RSA and EC keys alike.
    - name: Check the key belongs to the certificate
      ansible.builtin.shell:
        cmd: "set -o pipefail; c=$(openssl x509 -in {{ nginx_ssl_certificate }} -noout -pubkey | sha256sum); k=$(openssl pkey -in {{ nginx_ssl_certificate_key }} -pubout | sha256sum); test \"$c\" = \"$k\""
        executable: /bin/bash
      register: nginx_custom_tls_match
      changed_when: false
      failed_when: false

    - name: Refuse a key that does not match the certificate
      ansible.builtin.fail:
        msg: >-
          The private key in vault_custom_tls_key does not belong to the
          certificate in vault_custom_tls_fullchain. It must be the key that was
          generated together with the CSR you gave Namecheap. nginx has NOT
          been changed.
      when: nginx_custom_tls_match.rc != 0

    - name: Read the purchased certificate
      community.crypto.x509_certificate_info:
        path: "{{ nginx_ssl_certificate }}"
      register: nginx_custom_tls_info

    - name: Refuse an expired certificate
      ansible.builtin.assert:
        that:
          - not nginx_custom_tls_info.expired
        fail_msg: "The purchased certificate expired on {{ nginx_custom_tls_info.not_after }}."
        quiet: true

    - name: Report the purchased certificate
      ansible.builtin.debug:
        msg: >-
          Purchased certificate for {{ nginx_custom_tls_info.subject_alt_name | default([]) | join(', ') }}
          — valid until {{ nginx_custom_tls_info.not_after }}. Browsers trust it
          only for THOSE names, and only where they resolve to this host.

- name: Check the TLS certificate exists
  ansible.builtin.stat:
    path: "{{ nginx_ssl_certificate }}"
  register: nginx_cert
  when: nginx_ssl_enabled | bool
  tags: [nginx, tls]

# nginx will not start without the certificate it is configured to use, and the
# failure appears as a systemd start error rather than anything about TLS.
- name: Refuse to configure TLS without a certificate
  ansible.builtin.assert:
    that:
      - nginx_cert.stat.exists
    fail_msg: >-
      {{ nginx_ssl_certificate }} does not exist. Run the `certificates` role
      first — playbooks/networking.yml includes it. Note this must be the
      FULLCHAIN file: serving the leaf alone gives clients
      "unable to get local issuer certificate".
    success_msg: "TLS certificate present"
  when: nginx_ssl_enabled | bool
  tags: [nginx, tls]

# ── Configuration ───────────────────────────────────────────────────────────

- name: Install the shared proxy parameters
  ansible.builtin.template:
    src: proxy_params.j2
    dest: "{{ nginx_conf_dir }}/snippets/jengasec-proxy.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  tags: [nginx, config]

- name: Install the security headers snippet
  ansible.builtin.template:
    src: security-headers.conf.j2
    dest: "{{ nginx_conf_dir }}/snippets/jengasec-security-headers.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  tags: [nginx, config, headers]

# The site config cannot be validated on its own with `nginx -t -c` — that flag
# expects a whole configuration. It is written, then the full config is
# validated in one step below, before anything is reloaded.
- name: Write the JengaSec site configuration
  ansible.builtin.template:
    src: jengasec.conf.j2
    dest: "{{ nginx_conf_dir }}/sites-available/jengasec.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload nginx
  tags: [nginx, site]

- name: Enable the JengaSec site
  ansible.builtin.file:
    src: "{{ nginx_conf_dir }}/sites-available/jengasec.conf"
    dest: "{{ nginx_conf_dir }}/sites-enabled/jengasec.conf"
    state: link
  notify: Reload nginx
  tags: [nginx, site]

# It answers on port 80 for any unmatched Host, which on a competition network
# is one more thing responding to a scan with a recognisable default page.
- name: Remove the default site
  ansible.builtin.file:
    path: "{{ nginx_conf_dir }}/sites-enabled/default"
    state: absent
  when: nginx_remove_default_site | bool
  notify: Reload nginx
  tags: [nginx, site]

# LAST of the files, not first. Its validate (`nginx -t -c`) loads the WHOLE
# configuration, sites-enabled included — so written first, it was judged
# against the PREVIOUS run's site file and an old mistake there (e.g. the
# `http2` directive on nginx 1.22) blocked the very run that fixes it.
- name: Write nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_conf_dir }}/nginx.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: "nginx -t -c %s"
  notify: Reload nginx
  tags: [nginx, config]

# ── Validate then apply ─────────────────────────────────────────────────────

# The whole configuration, including the site and both snippets. If this fails
# the handler never runs and the live nginx keeps its working config.
- name: Validate the complete configuration
  ansible.builtin.command:
    cmd: nginx -t
  register: nginx_validate
  changed_when: false
  tags: [nginx, config, site]

- name: Apply pending nginx changes
  ansible.builtin.meta: flush_handlers
  tags: [nginx]

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: "{{ nginx_service_name }}"
    enabled: true
    state: started
  tags: [nginx, service]

# ── Verification ────────────────────────────────────────────────────────────

- name: Confirm nginx is listening
  ansible.builtin.shell:
    cmd: "ss -tlnp | grep -E ':(80|443)\\b' || true"
  args:
    executable: /bin/bash
  register: nginx_listening
  changed_when: false
  tags: [nginx, verify]

- name: Report listening sockets
  ansible.builtin.debug:
    msg: "{{ nginx_listening.stdout_lines | default(['nginx is not listening']) }}"
  tags: [nginx, verify]

# Hits nginx over the loopback with the real Host header, following redirects.
# Proves the vhost matches, TLS works, and the upstream answers.
- name: Request the site through nginx
  ansible.builtin.uri:
    url: "https://127.0.0.1/"
    headers:
      Host: "{{ nginx_server_name }}"
    validate_certs: false      # the internal CA is not in curl's default store
    follow_redirects: all
    status_code: [200, 302, 400, 502, 503]
    timeout: 15
  register: nginx_probe
  changed_when: false
  failed_when: false
  when: nginx_ssl_enabled | bool
  tags: [nginx, verify]

# 502 is the one worth naming: it almost always means nginx cannot write to the
# gunicorn socket, and the evidence is in nginx's log rather than gunicorn's.
- name: Report the probe result
  ansible.builtin.debug:
    msg: >-
      {{ nginx_server_name }} returned {{ nginx_probe.status | default('no response') }}.
      {{ '502 means nginx cannot reach gunicorn — check the socket is
          srw-rw---- jengasec:www-data and that gunicorn is running.'
         if (nginx_probe.status | default(0)) == 502 else '' }}
      {{ '503 usually means every upstream backend is marked failed.'
         if (nginx_probe.status | default(0)) == 503 else '' }}
  when: nginx_ssl_enabled | bool
  tags: [nginx, verify]
