# postgresql — Phase 5
# PostgreSQL server, databases, roles, and connection policy.
#
# STATUS: NOT YET IMPLEMENTED.
#
# This role fails loudly rather than reporting success while doing nothing.
# A green Ansible run that changed nothing is the most expensive kind of bug in
# infrastructure code: you believe a machine is configured when it is not.
#
# Planned responsibilities:
#   - Install PostgreSQL and the contrib packages
#   - Tune postgresql.conf for the available RAM
#   - Render pg_hba.conf from postgresql_hba_entries
#   - Create databases and roles from group_vars
#   - Install extensions
#   - Configure WAL archiving for point-in-time recovery
#   - Streaming replication (Phase 6)
#
# To implement: fill defaults/main.yml first, then templates/, then these tasks,
# then delete the fail below and update the status table in docs/roles.md.

- name: Refuse to run — the postgresql role is not implemented yet
  ansible.builtin.fail:
    msg: >-
      The 'postgresql' role is a Phase 5 stub and has no tasks yet.
      Nothing was configured on {{ inventory_hostname }}.
      Implement it, or remove it from the playbook you are running.
      See docs/roles.md and roles/postgresql/README.md.
  when: not postgresql_enabled | bool
  tags:
    - postgresql
    - stub

