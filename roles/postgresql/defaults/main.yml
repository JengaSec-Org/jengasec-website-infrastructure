---
# Defaults for the `postgresql` role — Phase 5.
#
# STATUS: NOT YET IMPLEMENTED. The variables below are the role's intended
# contract, chosen now so that group_vars written today keep working when the
# tasks are filled in. Override them in group_vars, not here.

# Guard. Stays false until the role is written; see tasks/main.yml.
postgresql_enabled: false

# the version Debian 12 ships
postgresql_version: 15
# widen only for a remote app host
postgresql_listen_addresses: "localhost"
postgresql_port: 5432
postgresql_max_connections: 100
# roughly 25% of RAM
postgresql_shared_buffers: "256MB"
# roughly 50-75% of RAM
postgresql_effective_cache_size: "768MB"
# per sort operation, multiplied by connections
postgresql_work_mem: "4MB"
# never md5
postgresql_password_encryption: scram-sha-256
postgresql_databases: []
postgresql_users: []
postgresql_hba_entries: []
postgresql_extensions: ["pg_stat_statements"]
