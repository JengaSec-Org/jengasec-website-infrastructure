---
# Handlers for the `django` role.

# SIGHUP via systemd — gunicorn re-execs its workers while holding the socket
# open, so nothing in flight is dropped and no request is refused. A code or
# environment change should never need a full restart.
#
# The handler lives here as well as in the gunicorn role because Ansible
# resolves `notify` within the roles included in the play, and platform.yml
# always includes both.
- name: Reload gunicorn
  ansible.builtin.systemd:
    name: "{{ gunicorn_service_name | default('gunicorn') }}"
    state: reloaded
  listen: "reload gunicorn"
  failed_when: false      # not yet installed on the very first run
