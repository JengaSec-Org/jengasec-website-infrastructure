---
# JengaSec development inventory — the control node itself.
#
# Purpose: render every template and evaluate every conditional WITHOUT touching
# a real server. This is what catches undefined variables and broken Jinja2
# before you point Ansible at hardware.
#
#   ansible-playbook -i inventories/development playbooks/bootstrap.yml \
#       --check --diff --connection=local
#
# It carries dummy secrets in group_vars so no vault password is needed. Those
# dummies are why this inventory must NEVER be used against a real machine.

all:
  children:
    infra:
      hosts:
        localhost:
          ansible_connection: local

    # localhost stands in for every function, so a --check run exercises the
    # group_vars of all of them in one pass.
    web:
      hosts:
        localhost:
    database:
      hosts:
        localhost:
    dns:
      hosts:
        localhost:
    backup:
      hosts:
        localhost:
    monitoring:
      hosts:
        localhost:
    monitored:
      hosts:
        localhost:

  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
