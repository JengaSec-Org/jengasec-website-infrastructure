---
# JengaSec staging inventory.
#
# Same group structure as production, so a playbook that works here works there.
# The point of staging is to rehearse a phase — especially `networking` and
# `firewall` — somewhere that losing SSH does not cost you the competition.
#
# A single VM can host every group at once: put the same hostname in each group.
#
# TODO: replace the address below, or delete this inventory if you have no
# staging environment yet.

all:
  children:
    infra:
      hosts:
        staging1:
          ansible_host: 10.0.1.11        # TODO: replace

    web:
      hosts:
        staging1:
    database:
      hosts:
        staging1:
    dns:
      hosts:
        staging1:
    monitored:
      hosts:
        staging1:

    # DHCP is deliberately absent. Running a second DHCP server on a shared
    # network hands out conflicting leases to everyone on it.

  vars:
    ansible_user: debian                 # TODO: replace
    ansible_port: "{{ ssh_port }}"
    ansible_python_interpreter: /usr/bin/python3
