---
# Variables for the `web` group — nginx + gunicorn + Django (v1: the jengasec VM).

# ── Firewall ────────────────────────────────────────────────────────────────
# Merged with firewall_rules_common by the firewall role.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  NOTHING IS OPEN TO THE INTERNET.                                       │
# │                                                                         │
# │  Off-campus traffic arrives through the Cloudflare Tunnel, which is an   │
# │  OUTBOUND connection from server1 — no inbound port is involved at all.  │
# │                                                                         │
# │  So 443 is restricted to the competition LAN and 80 is closed entirely.  │
# │  On-campus users reach nginx directly, which is faster and keeps working │
# │  if Cloudflare is unreachable; everyone else comes via the tunnel.       │
# │                                                                         │
# │  The result: server1 is invisible to internet-wide scanning. That is the │
# │  main security win of running a tunnel, and re-opening these rules to    │
# │  `any` would throw it away.                                             │
# └─────────────────────────────────────────────────────────────────────────┘
firewall_rules_group:
  - port: 443
    proto: tcp
    from: "{{ jengasec_network_cidr }}"
    comment: "HTTPS — competition LAN only; off-campus arrives via the tunnel"

# Port 80 is deliberately absent. nginx still listens on it and still redirects
# to HTTPS — harmless behind a closed firewall, and correct again if the rule
# is ever restored. Re-add it here if you move to Let's Encrypt, whose http-01
# challenge needs inbound 80.

# ── Gunicorn (Phase 4, role currently a stub) ───────────────────────────────
# Worker count follows the (2 x cores) + 1 convention, capped so the box keeps
# headroom for nginx and the AI request queue.
gunicorn_workers: "{{ [(ansible_processor_vcpus | int * 2) + 1, 9] | min }}"
gunicorn_worker_class: sync
gunicorn_timeout: 120          # AI evaluation calls to Ollama are slow
gunicorn_bind: "unix:/run/gunicorn/gunicorn.sock"

# ── Django (Phase 4, role currently a stub) ─────────────────────────────────
# These become the .env file rendered by the django role. Names match exactly
# what config/settings.py reads — do not rename them.
django_debug: false

# Both names, because both reach this platform. Django returns 400 for any Host
# header not listed here — so omitting the public name means the tunnel
# delivers requests the application then refuses, which presents as a Cloudflare
# error rather than a Django one.
#
# django_csrf_trusted_origins is derived from this list, so the public origin is
# trusted automatically.
django_allowed_hosts:
  - "platform.{{ jengasec_domain }}"          # internal, via Bind9
  - "platform.{{ jengasec_public_domain }}"   # public, via the Cloudflare Tunnel
  - "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
  - "{{ jengasec_web_vlan_address }}"         # VLAN 109 address
  - "{{ jengasec_venue_hostname }}"           # venue, via the range's DNS

# Email backend is left to the role: Brevo when vault_brevo_api_key is set
# (same as Render), SMTP otherwise.

# ── Website data: jengasec_web on the database VM (cutover) ─────────────────
# The campus blocks outgoing port 5432, so this VM cannot reach Neon. Instead,
# ONE copy accepts writes at a time:
#   until the cutover   Render + Neon, as today
#   at the cutover      Neon is exported at home and imported into jengasec_web
#                       on the database VM — scripts/cutover/README.md
#   from then on        THIS VM is the live site; Render is read-only/suspended
#
# All in the vault:
#   vault_jengasec_db_url      postgresql://jengasec_web:...@192.168.40.45:5432/jengasec_web?sslmode=prefer
#                              — setup-database-vm.sh prints it
#   vault_django_secret_key    the SAME value as Render, so passwords' reset
#                              links and stored registry tokens keep working
#   vault_s3_*                 the SAME Backblaze bucket and keys — uploaded files
#                              stay where they are; only the database moves
#   vault_brevo_api_key        the SAME Brevo key
# Required, so the site can never quietly start on an empty local database.
django_require_db_url: true

jengasec_venue_hostname: jengasec.range

# Links in emails are opened from home, where jengasec.range does not resolve,
# so they always point at the public site.
django_site_url: "https://www.jengasec.com"

# Plain-HTTP sign-in, ONLY if the internal-CA certificate is not ready in
# time. nginx here already serves TLS from the internal CA, so this should stay
# false; see "The HTTPS trap" in VENUE-HOSTING.md before turning it on.
django_insecure_cookies: false

# ── Read-only copy on the database VM ───────────────────────────────────────
# Neon → jengasec_web on 192.168.40.45, one way, by logical replication. A
# separate database from the range API's on the same server; the website never
# reads or writes it. Switch on once logical replication is enabled in Neon and
# the database VM's admin login is in the vault — roles/replica/README.md.
replica_enabled: false
replica_host: 192.168.40.45
replica_port: 5432

# ── Range portal API ────────────────────────────────────────────────────────
# Registration with a WireGuard public key, VPN profiles for approved people,
# and staff revocation all go through the range team's API on THIS VM, bound to
# loopback — which is why the website backend must run here. Django calls it
# server-side through services/portal_client.py (from the range team's kit);
# the browser never sees the API or the token.
#
# Render cannot reach 127.0.0.1 on this VM, so these features work only on
# this front door. Everything else is shared.
#
# PROVISIONAL: the environment names below are placeholders until the kit
# arrives. Confirm them against portal_client.py before relying on them.
django_portal_api_url: "http://127.0.0.1:8080"

# Derived https:// origins for every name above, plus the bare-address http://
# origin while insecure cookies are on — that is the only time a form can be
# posted over plain HTTP.
django_csrf_trusted_origins: >-
  {{ django_allowed_hosts
     | reject('equalto', '*')
     | map('regex_replace', '^(.*)$', 'https://\\1')
     | list
     + ((['http://' ~ (ansible_default_ipv4.address | default('127.0.0.1')),
          'http://' ~ jengasec_venue_hostname])
        if (django_insecure_cookies | bool) else []) }}

# ── nginx ───────────────────────────────────────────────────────────────────
# server_name stays the internal name — the TLS certificate is issued for it,
# and cloudflared presents it as SNI. The public name is an alias, so the same
# vhost answers both.
nginx_server_aliases:
  - "platform.{{ jengasec_public_domain }}"
  - "{{ jengasec_venue_hostname }}"

# ── Cloudflare ──────────────────────────────────────────────────────────────
# Off until the Cloudflare prerequisites exist — an account, a zone, a tunnel,
# and its token. See docs/runbook.md.
cloudflare_enabled: false
cloudflare_access_allowed_email_domain: strathmore.edu

# Not used while vault_jengasec_db_url is set, which django_require_db_url
# above insists on. Kept so the role's defaults stay complete if this VM is
# ever pointed at a local database again.
django_db_name: jengasec
django_db_user: jengasec
django_db_host: 127.0.0.1
django_db_port: 5432
django_db_sslmode: prefer      # 'require' once certificates are in place

# ── Ollama AI layer ─────────────────────────────────────────────────────────
ollama_base_url: "http://localhost:11434"
ollama_model: llama3
