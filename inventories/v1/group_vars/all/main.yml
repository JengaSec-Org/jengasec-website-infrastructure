---
# ─────────────────────────────────────────────────────────────────────────────
# Site-wide variables for the v1 single-VM deployment on Server 3.
#
# Precedence, lowest to highest:
#   roles/<role>/defaults/main.yml   safe default shipped with the role
#   group_vars/all/main.yml          THIS FILE — site-wide choices
#   group_vars/<group>/main.yml      per-function overrides
#   host_vars/<host>.yml             machine-specific facts (IP, interface)
#
# See docs/variables.md for the full key reference.
# ─────────────────────────────────────────────────────────────────────────────

# ── Identity ────────────────────────────────────────────────────────────────
jengasec_org: "Strathmore Cybersecurity Club"
# The INTERNAL name, served by Bind9 on the competition LAN.
jengasec_domain: jengasec.local          # TODO: replace if you use a real domain

# The PUBLIC name, served through the Cloudflare Tunnel.
#
# Split-horizon: both names reach the same platform. On campus, Bind9 resolves
# the .local name and traffic goes straight to nginx. Off campus, Cloudflare
# resolves the public name and traffic arrives through the tunnel.
#
# This MUST be a real domain in a zone you control. Cloudflare cannot serve
# .local — it is reserved for mDNS — and the cloudflare role refuses to start
# with one, because the failure at Cloudflare's end is opaque.
jengasec_public_domain: jengasec.example   # TODO: replace with your real domain

jengasec_environment: v1

# The competition LAN. Used by the firewall (trusted sources), Bind9 (recursion
# ACL), and DHCP (subnet declaration) — set it once, correctly, here.
jengasec_network_cidr: "192.168.40.0/24"   # Kindaruma lab segment
jengasec_network_gateway: "192.168.40.1"

# Who may reach the website at the event — from NET's "JengaSec VLANs and IP
# ranges" (14 Oct 2026, also contracts/address-plan.md in the range repo).
# Everyone at the venue is on the one Wi-Fi, VLAN 105; VLANs 102-104, 106 and
# 107 exist but have no wall ports, so they are not listed. If NET change the
# plan, this list is the only thing to edit.
jengasec_venue_cidrs:
  - "10.105.0.0/22"     # VLAN 105 Wi-Fi "JengaSec" — everyone at the venue
  - "10.109.0.0/24"     # VLAN 109 back-end servers (deploy agent, observability)
  - "10.63.0.0/24"      # WireGuard: staff and judges
  - "10.60.0.0/14"      # WireGuard: App Red, App Blue, AI Blue (10.60-10.62)
  - "10.64.0.0/16"      # WireGuard: AI Red

# The website VM's second address, on VLAN 109, once NET add that network
# card. It keeps 192.168.40.11 as well.
jengasec_web_vlan_address: "10.109.0.10"

# ── Localisation ────────────────────────────────────────────────────────────
# Matches TIME_ZONE in the platform's config/settings.py. Keeping the servers
# and Django on the same zone is what makes log correlation possible during an
# incident, so do not change one without the other.
common_timezone: "Africa/Nairobi"
common_locale: "en_US.UTF-8"

# ── Banner stamped into every Ansible-managed file ──────────────────────────
# Referenced by every template as {{ common_managed_banner }}. Anyone who finds
# one of these files on a server knows edits will be overwritten on next run.
common_managed_banner: >-
  Managed by Ansible — jengasec-infrastructure.
  Local edits WILL be overwritten. Change the template and re-run instead.

# ── SSH ─────────────────────────────────────────────────────────────────────
# Also consumed by hosts.yml (ansible_port) and by the firewall role's assert.
# If you change this, you must be able to reach the box on the NEW port before
# the next run, or you are locked out. Read docs/runbook.md first.
ssh_port: 22

# ── Who logs in: one shared account, by password ────────────────────────────
# v1 decision: everyone signs in as `netadmin` (the account the Debian
# installer created) with its password. No SSH keys, no per-person accounts.
#
# What that costs, so it is a choice and not an accident:
#   - The logs cannot say WHO did something, only that netadmin did. The
#     Strathmore remote-access plan asks for individual accounts (§4, §9).
#   - Removing one person means changing the password for everyone.
#   - A password can be guessed; a key cannot. What limits that here: SSH is
#     reachable only from the lab LAN and the VPN range (firewall below),
#     fail2ban bans an address after 3 failures, and MaxAuthTries is 3.
# So: a long password (`openssl rand -base64 18` is a good one), handed over in
# person, and changed whenever someone leaves the team:
#     sudo passwd netadmin
ssh_password_authentication: true

# SSH accepts netadmin and nobody else. The website's `jengasec` account and
# the service accounts are not logins.
ssh_allow_users:
  - netadmin
ssh_allow_groups:
  - sudo

# ── Service accounts created on every host by the `users` role ──────────────
# Passwords are never set here; these are key-only accounts. netadmin is not
# listed: the installer created it and its password is set by hand.
users_service_accounts: "{{ jengasec_service_accounts }}"

jengasec_service_accounts:
  - name: jengasec
    comment: "JengaSec administrator"
    groups: [sudo, adm]
    shell: /bin/bash
    system: false
    sudo_nopasswd: false

  - name: deploy
    comment: "Application deployment account"
    groups: [jengasec]
    shell: /bin/bash
    system: false
    # Restricted sudo — may only restart the app services, nothing else.
    sudo_nopasswd: true
    sudo_commands:
      - "/usr/bin/systemctl restart gunicorn"
      - "/usr/bin/systemctl restart nginx"
      - "/usr/bin/systemctl status gunicorn"

  - name: backup
    comment: "Backup service account"
    groups: []
    shell: /usr/sbin/nologin
    system: true
    sudo_nopasswd: false

  - name: monitoring
    comment: "Prometheus node_exporter account"
    groups: []
    shell: /usr/sbin/nologin
    system: true
    sudo_nopasswd: false

# No SSH keys in v1 — netadmin signs in with its password (see above).
users_admin_ssh_keys: []

# ── Firewall ────────────────────────────────────────────────────────────────
# Rules that apply everywhere. Per-function rules (80/443, 5432, 53, 67) are
# added in the matching group_vars file and merged by the firewall role.
#
# WARNING: the SSH rule below is what keeps you connected. The firewall role
# asserts that ssh_port appears in the merged rule list and refuses to run if
# it does not.
#
# SSH is allowed from the lab LAN and from the Strathmore VPN's address range,
# so people reach the VM from home through FortiClient. With password login on,
# this restriction is what keeps the login prompt off the internet — never
# widen it to `any`. The VPN range comes
# from ICT (the remote-access plan, §22 "VPN source range") — do not guess it.
# Until it is filled in, SSH works from the lab only.
jengasec_vpn_cidrs: []
  # - "10.x.x.x/xx"        # TODO: replace with the range ICT gives you

# One expression, not a {% for %} block: since ansible-core 2.19 a block
# renders to TEXT, and `common + group + host` then fails with "can only
# concatenate str". An expression keeps its list type in every version.
firewall_rules_common: >-
  {{ [{'port': ssh_port, 'proto': 'tcp', 'from': jengasec_network_cidr,
       'comment': 'SSH from the lab LAN'}]
     + (jengasec_vpn_cidrs
        | map('community.general.dict_kv', 'from')
        | map('combine', {'port': ssh_port, 'proto': 'tcp',
                          'comment': 'SSH from the Strathmore VPN'})
        | list) }}

# ── Application paths ───────────────────────────────────────────────────────
# These mirror the platform's config/settings.py:
#   STATIC_ROOT = BASE_DIR / "staticfiles"
#   MEDIA_ROOT  = BASE_DIR / "media"
# The nginx, storage, backup, and audit roles all derive their paths from these,
# so the whole stack agrees on where the application lives.
app_name: jengasec
app_user: jengasec
app_group: jengasec
app_root: "/opt/jengasec"
app_source_dir: "{{ app_root }}/app"
app_venv_dir: "{{ app_root }}/venv"
app_static_dir: "{{ app_source_dir }}/staticfiles"
app_media_dir: "{{ app_source_dir }}/media"
app_log_dir: "/var/log/jengasec"
app_repo_url: "https://github.com/JengaSec-Org/jengasec-competition-platform.git"
app_repo_branch: main
