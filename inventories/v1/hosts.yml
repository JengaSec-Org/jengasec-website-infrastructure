---
# JengaSec v1 inventory — ONE Debian 12 VM on Server 3 (Proxmox) carries the
# whole platform, and is its own Ansible control node.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Same group structure as production, so every playbook and role runs   │
# │  unchanged. The only difference is that one host is a member of every  │
# │  function group. Splitting back out to three machines later is an edit │
# │  to THIS file and host_vars — nothing else.                            │
# │                                                                        │
# │  Run from a clone of this repo ON the VM itself:                       │
# │      make <target> INVENTORY=inventories/v1                            │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Colocation has consequences that group_vars/ and host_vars/ here address:
#   - Only ONE group's firewall_rules_group survives Ansible precedence, so
#     host_vars/jengasec.yml carries the union in firewall_rules_host.
#   - Anything that referenced hostvars['server1'|'server2'|'server3'] would
#     fall back to 10.0.0.x. Those are pinned to loopback in group_vars here.
#   - DHCP is intentionally empty. The lab already runs a DHCP server on
#     192.168.40.0/24, and two on one broadcast domain breaks the rack.

all:
  children:

    # Phases 1-3 apply to every host. There is one.
    infra:
      hosts:
        jengasec:
          ansible_host: 192.168.40.11
          # Ansible runs on this box. No SSH hop, no key distribution.
          ansible_connection: local

    # nginx + gunicorn + Django
    web:
      hosts:
        jengasec:

    # PostgreSQL + Redis
    database:
      hosts:
        jengasec:

    # Bind9 authoritative + recursive resolver for jengasec.local
    dns:
      hosts:
        jengasec:

    # Deliberately empty — see the note above.
    dhcp:
      hosts: {}

    # Backup target. Pulls from itself for now; a separate box is a v2 item.
    backup:
      hosts:
        jengasec:

    # Prometheus + Grafana
    monitoring:
      hosts:
        jengasec:

    # node_exporter
    monitored:
      hosts:
        jengasec:

  vars:
    # The account the Debian installer created on the VM. The `users` role
    # creates `jengasec` alongside it; switch this once that has run and the
    # admin key is installed, or keep using netadmin — both are in sudo.
    ansible_user: netadmin
    ansible_python_interpreter: /usr/bin/python3
