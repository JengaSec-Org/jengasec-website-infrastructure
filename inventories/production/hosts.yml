---
# JengaSec production inventory.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  TODO: replace every ansible_host address below with the real one.      │
# │  Per-host network settings (gateway, interface, DNS) live in            │
# │  host_vars/serverN.yml — those carry their own TODO markers.            │
# │                                                                         │
# │  Find everything still unset:  grep -rn "TODO: replace" inventories/    │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Hosts are grouped by FUNCTION, not by machine. A role targets "database",
# never "server2" — so moving PostgreSQL to another box is an edit here rather
# than a change to any role or playbook.

all:
  children:

    # ── Every JengaSec server. Phases 1-3 apply to all of them. ────────────
    infra:
      hosts:
        server1:
          ansible_host: 10.0.0.11   # TODO: replace
        server2:
          ansible_host: 10.0.0.12   # TODO: replace
        server3:
          ansible_host: 10.0.0.13   # TODO: replace

    # ── Function groups. A host may belong to several. ─────────────────────

    # nginx + gunicorn + Django. The 8 GB machine.
    web:
      hosts:
        server1:

    # PostgreSQL and Redis. The 4 GB machine.
    database:
      hosts:
        server2:

    # Bind9 authoritative + recursive resolver for jengasec.local.
    dns:
      hosts:
        server2:

    # isc-dhcp-server for the competition LAN.
    # Only ONE host may serve DHCP on a broadcast domain.
    dhcp:
      hosts:
        server2:

    # Backup target. Holds PostgreSQL dumps, media, and config archives.
    backup:
      hosts:
        server3:

    # Prometheus + Grafana. Deliberately not on the web or database host, so
    # monitoring survives the failure it is meant to report.
    monitoring:
      hosts:
        server3:

    # Every host runs node_exporter so monitoring can scrape it.
    monitored:
      hosts:
        server1:
        server2:
        server3:

  vars:
    # Connection defaults for the whole inventory.
    #
    # ansible_user is the account you can already SSH in as on a fresh Debian
    # install. After the `users` role has run once, switch this to `jengasec`.
    ansible_user: debian                     # TODO: replace
    ansible_port: "{{ ssh_port }}"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519   # TODO: replace
