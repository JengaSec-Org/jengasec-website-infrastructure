---
# JengaSec LAB inventory — four VirtualBox VMs on a laptop.
#
# Mirrors production's group structure exactly, so a playbook that works here
# works there. What differs is sizing, and that everything needing real
# credentials or a real domain is switched off.
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │  NETWORK LAYOUT — two adapters per VM, and both are needed.               │
# │                                                                           │
# │    Adapter 1  NAT           internet, so apt works                        │
# │                             Debian usually names it enp0s3                │
# │    Adapter 2  Host-only     the "competition LAN" — VMs and the control   │
# │                             node see each other.  usually enp0s8          │
# │                                                                           │
# │  VirtualBox's plain NAT is PER-VM and isolated: with only that, the VMs   │
# │  cannot see each other at all. Host-only is what makes them a network.    │
# │  Host-only alone has no internet, so apt fails. Hence both.               │
# │                                                                           │
# │  The default route belongs to the NAT adapter. The host-only interface    │
# │  gets NO gateway — see docs/lab-setup.md.                                 │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Addresses are on VirtualBox's default host-only network, 192.168.56.0/24,
# with the host itself at .1. VirtualBox 7 only permits host-only networks
# inside 192.168.56.0/21 unless you edit /etc/vbox/networks.conf, so staying
# here avoids a confusing "invalid host-only address" refusal.

all:
  children:

    infra:
      hosts:
        server1:
          ansible_host: 192.168.56.11
        server2:
          ansible_host: 192.168.56.12
        server3:
          ansible_host: 192.168.56.13

    web:
      hosts:
        server1:

    database:
      hosts:
        server2:

    dns:
      hosts:
        server2:

    # DHCP is deliberately EMPTY.
    #
    # VirtualBox runs its own DHCP server on both the NAT and host-only
    # networks. A second one would hand out conflicting leases to every VM
    # here — the exact failure the dhcp role warns about, and a good way to
    # spend an evening wondering why nothing can reach anything.
    #
    # To exercise that role, disable VirtualBox's host-only DHCP first
    # (File > Tools > Network Manager > untick "Enable Server"), then add
    # server2 here.
    dhcp:
      hosts: {}

    backup:
      hosts:
        server3:

    monitoring:
      hosts:
        server3:

    monitored:
      hosts:
        server1:
        server2:
        server3:

  vars:
    # The account created by the Debian installer. Change if you named it
    # something else.
    ansible_user: jengasec
    ansible_port: "{{ ssh_port }}"
    ansible_python_interpreter: /usr/bin/python3

    # Lab VMs are rebuilt and re-snapshotted constantly, so their host keys
    # change often. accept-new trusts a key the first time and still refuses a
    # CHANGED one — which is the part that matters.
    #
    # Never do this in production: it is the check that would catch someone
    # impersonating a server.
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
