[defaults]
# JengaSec Infrastructure — Ansible control node configuration.
# Run every command from the repository root so these relative paths resolve.

inventory              = inventories/production
roles_path             = roles
collections_path       = collections
host_key_checking      = True
retry_files_enabled    = False
interpreter_python     = auto_silent
stdout_callback        = yaml
bin_ansible_callbacks  = True
callbacks_enabled      = profile_tasks, timer
forks                  = 10
timeout                = 30
log_path               = logs/ansible.log

# vault_password_file is deliberately COMMENTED OUT.
#
# When it is set and the file does not exist, Ansible refuses to run ANY
# command — including --syntax-check and the development inventory, neither of
# which needs a vault. That turns "clone the repo and check it parses" into a
# confusing error about a missing password file.
#
# Uncomment it once you have created .vault_pass (see docs/secrets.md), or just
# pass --ask-vault-pass when you run against production:
#
#     echo 'your-vault-password' > .vault_pass && chmod 600 .vault_pass
#
# vault_password_file  = .vault_pass

# Facts are cached so repeat runs across a multi-phase deployment stay quick.
gathering              = smart
fact_caching           = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout   = 7200

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
# Pipelining roughly halves the number of SSH operations per task.
# It requires "Defaults !requiretty" in sudoers, which Debian 12 already satisfies.
pipelining    = True
ssh_args      = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
control_path  = /tmp/ansible-ssh-%%h-%%p-%%r
scp_if_ssh    = smart
